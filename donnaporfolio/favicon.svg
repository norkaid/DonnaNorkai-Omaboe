<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="64" height="64">
  <defs>
    <style>
      @keyframes rotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .circle-text {
        animation: rotate 20s linear infinite;
        transform-origin: 50px 50px;
      }
    </style>
  </defs>
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="#C8A2C8" opacity="0.15"/>
  
  <!-- Rotating circular text -->
  <g class="circle-text">
    <path id="circle-path" d="M 50,50 m -38,0 a 38,38 0 1,1 76,0 a 38,38 0 1,1 -76,0" fill="none"/>
    <text font-family="Arial, sans-serif" font-size="7" font-weight="bold" fill="#C8A2C8">
      <textPath href="#circle-path" startOffset="0%">DONNA NORKAI OMABOE • </textPath>
    </text>
  </g>
  
  <!-- Center circle with initials -->
  <circle cx="50" cy="50" r="18" fill="#C8A2C8" opacity="0.25"/>
  <circle cx="50" cy="50" r="18" fill="none" stroke="#C8A2C8" stroke-width="1.5" opacity="0.5"/>
  <text x="50" y="50" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#C8A2C8" text-anchor="middle" dominant-baseline="middle">DN</text>
</svg>

